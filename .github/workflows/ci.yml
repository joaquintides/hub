on:
  pull_request:
  push:
    paths-ignore:
      - LICENSE
      - meta/**
      - README.md

jobs:
  call-boost-ci:
    with:
      branch_coverage: false
      enable_pr_coverage: false
    name: Run Boost.CI
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    env:
      B2_TARGETS: >
        libs/${{ github.repository.split('/')[1] }}/test
        libs/${{ github.repository.split('/')[1] }}/example
